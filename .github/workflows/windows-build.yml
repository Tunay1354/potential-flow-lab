# Builds the Windows program on GitHub's own Windows computer (ROADMAP 24): the exe folder from
# packaging/build_exe.spec, checked (the verification report without a window must be 108 / 108, the window
# must start and log no error); then the installer from packaging/installer.iss, checked too (installed
# silently, verified from where it was installed, .pflow linked, uninstalled); then the two zips handed in for the
# assignment (packaging/make_submission.py: report, user guide, the program as a folder or as the installer,
# source code, verification report). Started by hand (Actions → Windows build → Run workflow; tick "release" to
# publish it as v<APP_VERSION> of app_info.py) or by a version tag (v1.0.0): a release puts the two zips on the
# Releases page (an existing release of that version gets its files replaced; files it no longer has are removed).
name: Windows build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish it on the Releases page (as v + APP_VERSION of app_info.py)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write                    # (to create the release)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Names (app_info.py)
        run: |
          $n, $v, $o, $s = python -c "import app_info as a; print(a.APP_NAME); print(a.APP_VERSION); print(a.ORGANIZATION); print(a.APP_SUBTITLE)"
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$v" }
          $release = ($env:GITHUB_REF_TYPE -eq "tag") -or ("${{ inputs.release }}" -eq "true")
          "APP=$n", "VERSION=$v", "PUBLISHER=$o", "SUBTITLE=$s", "TAG=$tag", "RELEASE=$release",
            "LABEL=$(if ($release) { $tag } else { "build-$env:GITHUB_RUN_NUMBER" })" | Out-File -Append $env:GITHUB_ENV

      - name: Build the exe
        run: pyinstaller --noconfirm packaging/build_exe.spec

      - name: Check — verification without a window
        run: |
          $p = Start-Process "dist\$env:APP\$env:APP.exe" -ArgumentList "--verify","--out","exe-check\verify" -Wait -PassThru
          Get-Content exe-check\verify\verification.md -TotalCount 12
          if ($p.ExitCode -ne 0) { throw "verification: exit code $($p.ExitCode)" }

      - name: Check — a figure from a preset without a window
        run: |
          $scene = Get-ChildItem -Recurse presets -Filter 08_lifting_cylinder.pflow | Select-Object -First 1
          $p = Start-Process "dist\$env:APP\$env:APP.exe" -ArgumentList "`"$($scene.FullName)`"","--figure","exe-check\figure.png" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path exe-check\figure.png)) { throw "figure: exit code $($p.ExitCode)" }

      - name: Check — the window starts and logs no error
        run: |
          $p = Start-Process "dist\$env:APP\$env:APP.exe" -PassThru
          Start-Sleep -Seconds 90
          $running = -not $p.HasExited
          if ($running) { Stop-Process -Id $p.Id -Force }
          $log = Get-ChildItem -Recurse "$env:LOCALAPPDATA\$env:PUBLISHER" -Filter *.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Get-Content $log.FullName; Copy-Item $log.FullName exe-check\ }
          if (-not $running) { throw "the window closed by itself (exit code $($p.ExitCode))" }
          if ($log -and (Select-String -Path $log.FullName -Pattern "ERROR|Traceback" -Quiet)) { throw "errors in the log" }

      - name: Installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppName=$env:APP" "/DAppVersion=$env:VERSION" "/DPublisher=$env:PUBLISHER" "/DSubtitle=$env:SUBTITLE" `
            "/DSourceDir=$pwd\dist\$env:APP" "/DIconFile=$pwd\build\build_exe\$env:APP.ico" "/O$pwd" `
            "/F$env:APP-$env:LABEL-setup" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc: exit code $LASTEXITCODE" }
          Get-ChildItem *-setup.exe | Format-Table Name, Length

      - name: Check — install, run, uninstall (silently, this user)
        run: |
          $setup = (Get-ChildItem *-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART","/TASKS=desktopicon,assoc","/LOG=exe-check\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup: exit code $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\$env:APP"
          $exe = "$dir\$env:APP.exe"
          if (-not (Test-Path $exe)) { throw "not installed in $dir" }
          $assoc = (Get-ItemProperty "HKCU:\Software\Classes\.pflow" -ErrorAction SilentlyContinue).'(default)'
          if ($assoc -ne "$env:APP.Scene") { throw ".pflow is not linked ($assoc)" }
          $p = Start-Process $exe -ArgumentList "--verify","--out","exe-check\verify-installed","--no-figures" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "verification of the installed program: exit code $($p.ExitCode)" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw "the uninstaller left the program" }
          if (Test-Path "HKCU:\Software\Classes\$env:APP.Scene") { throw "the uninstaller left the .pflow link" }
          "installed, verified, uninstalled: OK"

      - name: Submission zips (the folder handed in, packaging/make_submission.py)
        run: |
          $setup = (Get-ChildItem *-setup.exe).FullName
          python packaging/make_submission.py --program "dist\$env:APP" --setup $setup --verify exe-check\verify `
            --name "$env:APP-$env:LABEL" --out submission-out
          if ($LASTEXITCODE -ne 0) { throw "make_submission: exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: |
            submission-out
            exe-check
          retention-days: 14

      - name: Release (a version tag, or "release" ticked)
        if: env.RELEASE == 'True'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem submission-out\*.zip).FullName
          $names = $files | ForEach-Object { Split-Path $_ -Leaf }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $files --clobber
            foreach ($old in (gh release view $env:TAG --json assets --jq ".assets[].name")) {
              if ($names -notcontains $old) { gh release delete-asset $env:TAG $old --yes }   # files of an older layout
            }
            gh release edit $env:TAG --notes-file packaging/release_notes.md
          } else {
            gh release create $env:TAG $files --target $env:GITHUB_SHA `
              --title "$env:APP $env:VERSION" --notes-file packaging/release_notes.md
          }
