# Builds the Windows program on GitHub's own Windows computer (ROADMAP 24): the exe folder from
# packaging/build_exe.spec, checked (the verification report without a window must be 102 / 102, the window
# must start and log no error), zipped. Started by hand (Actions → Windows build → Run workflow) or by a
# version tag (v1.0.0): then the zip also goes to the Releases page.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["ci-try"]

permissions:
  contents: write                    # (to create the release)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Build the exe
        run: pyinstaller --noconfirm packaging/build_exe.spec

      - name: Check — verification without a window
        shell: pwsh
        run: |
          $p = Start-Process dist\Flowy\Flowy.exe -ArgumentList "--verify","--out","exe-check\verify" -Wait -PassThru
          Get-Content exe-check\verify\verification.md -TotalCount 12
          if ($p.ExitCode -ne 0) { throw "verification: exit code $($p.ExitCode)" }

      - name: Check — a figure from a preset without a window
        shell: pwsh
        run: |
          $scene = Get-ChildItem -Recurse presets -Filter 08_lifting_cylinder.pflow | Select-Object -First 1
          $p = Start-Process dist\Flowy\Flowy.exe -ArgumentList "`"$($scene.FullName)`"","--figure","exe-check\figure.png" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path exe-check\figure.png)) { throw "figure: exit code $($p.ExitCode)" }

      - name: Check — the window starts and logs no error
        shell: pwsh
        run: |
          $p = Start-Process dist\Flowy\Flowy.exe -PassThru
          Start-Sleep -Seconds 90
          $running = -not $p.HasExited
          if ($running) { Stop-Process -Id $p.Id -Force }
          $log = Get-ChildItem -Recurse "$env:LOCALAPPDATA\IZTECH" -Filter *.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Get-Content $log.FullName; Copy-Item $log.FullName exe-check\ }
          if (-not $running) { throw "the window closed by itself (exit code $($p.ExitCode))" }
          if ($log -and (Select-String -Path $log.FullName -Pattern "ERROR|Traceback" -Quiet)) { throw "errors in the log" }

      - name: Zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "build-$($env:GITHUB_RUN_NUMBER)" }
          Compress-Archive -Path dist\Flowy -DestinationPath "Flowy-$name-windows.zip"
          Get-ChildItem Flowy-*.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: |
            Flowy-*.zip
            exe-check
          retention-days: 14

      - name: Release (version tags only)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem Flowy-*.zip).FullName `
            --title "Flowy $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            --notes-file packaging/release_notes.md
